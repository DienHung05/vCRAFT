# Hạ tầng phát triển cục bộ: `pnpm infra:up`
# CSDL nghiệp vụ (ADR-15) và object storage (ADR-14) nằm trên Supabase, không chạy container riêng.
# MySQL nằm trong profile "mysql" để kiểm chứng độc lập CSDL: `docker compose --profile mysql ... up -d`
name: vcraft
services:
  mysql:
    image: mysql:8.4
    profiles: ["mysql"]
    environment:
      MYSQL_DATABASE: vcraft
      MYSQL_USER: vcraft
      MYSQL_PASSWORD: vcraft
      MYSQL_ROOT_PASSWORD: root
    ports: ["3306:3306"]
    volumes: ["./.data/mysql:/var/lib/mysql"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]

  # Reverse proxy cùng origin: /api/* -> api, /q/* rewrite, còn lại -> web (xem infra/caddy/Caddyfile)
  caddy:
    image: caddy:2-alpine
    ports: ["8080:8080"]
    volumes:
      - "../caddy/Caddyfile:/etc/caddy/Caddyfile:ro"
      - "./.data/media:/srv/media:ro" # chỉ dùng khi STORAGE_DRIVER=local
    extra_hosts: ["host.docker.internal:host-gateway"]
