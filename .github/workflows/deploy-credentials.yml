# Daily early warning for expired or revoked production deploy credentials.
#
# deploy.yml only touches RENDER_API_KEY / VERCEL_TOKEN when a deploy runs, so a revoked key stays
# unnoticed until then (the Render key once started returning HTTP 401 at deploy time). This
# workflow makes one read-only API request per credential every day and fails when one is rejected,
# which triggers GitHub's failed-workflow notification. See docs/operations/deploy.md section 12.
#
# Uses the same `production` environment secrets and variables as deploy.yml and is skipped
# unless the CD_ENABLED variable is 'true'.

name: Deploy credentials

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check Render and Vercel credentials
    if: vars.CD_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Check deploy credentials
        run: bash scripts/ci/check-deploy-credentials.sh
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          RENDER_WORKER_SERVICE_ID: ${{ vars.RENDER_WORKER_SERVICE_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
