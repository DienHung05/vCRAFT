name: CI
on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pipeline mặc định bật; đặt repo variable CI_ENABLED=false để tắt.
  quality:
    if: vars.CI_ENABLED != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm deps:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # Chứng minh "độc lập CSDL": cùng bộ integration test chạy trên 2 hệ quản trị.
  # Test dựng CSDL thật bằng Testcontainers nên cần Docker daemon (ubuntu-latest có sẵn).
  # Suite rỗng KHÔNG còn được coi là xanh: không có file test thì bước này thất bại.
  integration:
    needs: quality
    if: vars.CI_ENABLED != 'false'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        db: [postgresql, mysql]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vcraft/api test:integration
        env:
          DB_DRIVER: ${{ matrix.db }}

  e2e:
    needs: quality
    if: vars.CI_ENABLED != 'false'
    runs-on: ubuntu-latest
    # Trang công khai đọc API thật nên E2E cần CSDL đã nạp dữ liệu mẫu và API đang chạy.
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_PASSWORD: pw, POSTGRES_DB: vcraft }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    env:
      DB_DRIVER: postgresql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: pw
      DB_NAME: vcraft
      DB_SSL: "false"
      API_INTERNAL_URL: http://localhost:4000/api/v1
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vcraft/e2e exec playwright install --with-deps chromium
      # Entity của @vcraft/database import @vcraft/utils và @vcraft/domain (xuất dist), nên build trước khi migrate
      - run: pnpm --filter @vcraft/domain --filter @vcraft/utils run build
      - run: pnpm db:migrate
      - name: Nạp dữ liệu mẫu
        run: pnpm demo:reset
        env:
          APP_ENV: demo
          NODE_ENV: test
          DEMO_RESET_CONFIRM: 127.0.0.1:5432/vcraft
      - run: pnpm exec turbo run build --filter=@vcraft/api
      - name: Chạy API nền
        run: |
          node apps/api/dist/main.js &
          for i in $(seq 1 30); do curl -sf localhost:4000/api/v1/village/stats && break; sleep 1; done
        env:
          APP_URL: http://localhost:4000
          STORAGE_DRIVER: local
          STORAGE_LOCAL_DIR: /tmp/vcraft/public
          STORAGE_LOCAL_PRIVATE_DIR: /tmp/vcraft/private
          STORAGE_SIGNING_KEY: ci-only-signing-key-0123456789abcdef0123456789
          MEDIA_PUBLIC_BASE_URL: http://localhost:4000/media
      # E2E chạy trên bản build production (`next start`); turbo build các gói workspace mà web phụ thuộc trước
      - run: pnpm exec turbo run build --filter=@vcraft/web
      - run: pnpm test:e2e
