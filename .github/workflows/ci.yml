name: CI
on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Turbo keeps its local cache inside the workspace so actions/cache can save and restore it.
  TURBO_CACHE_DIR: .turbo/cache
  # Set at workflow level so quality and e2e build the web app with identical env, hence identical turbo hashes
  # (turbo.json hashes API_INTERNAL_URL and NEXT_PUBLIC_* for the build task) and e2e can reuse quality's build cache.
  # NEXT_PUBLIC_TURNSTILE_SITE_KEY must match in both builds too, but is set per step/job instead: turbo forwards
  # NEXT_PUBLIC_* to every task, and the web unit tests fail when the CAPTCHA key is present.
  API_INTERNAL_URL: http://localhost:4000/api/v1

jobs:
  # Pipeline mặc định bật; đặt repo variable CI_ENABLED=false để tắt.
  quality:
    if: vars.CI_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      # Phiên cloud không chạy git hook cục bộ, nên chặn commit mang tên/ghi công AI ngay tại CI.
      - name: No AI attribution in commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            sh scripts/ci/check-no-ai-attribution.sh "$PR_BASE_SHA..$PR_HEAD_SHA"
          elif [ "$EVENT_NAME" = "push" ]; then
            case "$PUSH_BEFORE" in
              '' | *[!0]*) sh scripts/ci/check-no-ai-attribution.sh "$PUSH_BEFORE..$PUSH_SHA" ;;
              *) echo "New branch (before is all zeros): skipping." ;;
            esac
          fi
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-quality-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-quality-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-quality-${{ runner.os }}-
      - run: pnpm lint
      - run: pnpm deps:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:scripts
      - run: pnpm build
        env:
          # GH#84: Cloudflare's always-pass Turnstile test key, built into the web app for the CAPTCHA e2e.
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA

  # Chứng minh "độc lập CSDL": cùng bộ integration test chạy trên 2 hệ quản trị.
  # Test dựng CSDL thật bằng Testcontainers nên cần Docker daemon (ubuntu-latest có sẵn).
  # Suite rỗng KHÔNG còn được coi là xanh: không có file test thì bước này thất bại.
  # Runs in parallel with quality (no `needs`) and splits each database into 4 shards to cut wall-clock time.
  integration-shard:
    name: integration (${{ matrix.db }} ${{ matrix.shard }}/4)
    if: vars.CI_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        db: [postgresql, mysql]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vcraft/api test:integration --shard=${{ matrix.shard }}/4
        env:
          DB_DRIVER: ${{ matrix.db }}

  # The single required status check for integration: branch protection names `integration`, so the shard
  # count can change without touching it. `always()` makes it run (and fail) when a shard fails or is cancelled.
  integration:
    name: integration
    needs: integration-shard
    if: always() && vars.CI_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "${{ needs.integration-shard.result }}" = success

  e2e:
    if: vars.CI_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Trang công khai đọc API thật nên E2E cần CSDL đã nạp dữ liệu mẫu và API đang chạy.
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_PASSWORD: pw, POSTGRES_DB: vcraft }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    env:
      DB_DRIVER: postgresql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: pw
      DB_NAME: vcraft
      DB_SSL: "false"
      # Throwaway key for CI only (NFR-SEC-03): the demo seed encrypts sample ID numbers and the API refuses to start without one.
      FIELD_ENCRYPTION_KEYS: v1:Y2ktb25seS1maWVsZC1rZXktMDEyMzQ1Njc4OWFiY2Q=
      # GH#84: Cloudflare's always-pass Turnstile test key, built into the web app for the CAPTCHA e2e.
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-e2e-${{ runner.os }}-
            turbo-quality-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-quality-${{ runner.os }}-
      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(pnpm --filter @vcraft/e2e exec playwright --version | awk '{print $NF}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      # 99h: no `--with-deps` here, since it runs apt-get and fails whenever the Ubuntu mirrors are unreachable.
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @vcraft/e2e exec playwright install chromium
      # apt-based install with retries; falls back to the libraries already on the runner when Chromium still launches (scripts/ci/playwright-deps.sh).
      - name: Install Playwright system dependencies
        run: scripts/ci/playwright-deps.sh
      - run: pnpm db:migrate
      - name: Nạp dữ liệu mẫu
        run: pnpm demo:reset
        env:
          APP_ENV: demo
          NODE_ENV: test
          DEMO_RESET_CONFIRM: 127.0.0.1:5432/vcraft
      - run: pnpm exec turbo run build --filter=@vcraft/api
      - name: Chạy API nền
        run: |
          node apps/api/dist/main.js &
          # Fail the step when the API never becomes healthy, instead of letting the e2e run hit a dead server.
          for _ in $(seq 1 30); do
            curl -sf localhost:4000/api/v1/village/stats && exit 0
            sleep 1
          done
          echo "API did not become healthy within 30 s" >&2
          exit 1
        env:
          APP_URL: http://localhost:4000
          STORAGE_DRIVER: local
          STORAGE_LOCAL_DIR: /tmp/vcraft/public
          STORAGE_LOCAL_PRIVATE_DIR: /tmp/vcraft/private
          STORAGE_SIGNING_KEY: ci-only-signing-key-0123456789abcdef0123456789
          MEDIA_PUBLIC_BASE_URL: http://localhost:4000/media
          # GH#82: the Fox answers with the offline scripted model, so the widget e2e needs no OpenAI key.
          ASSISTANT_LLM: scripted
      # E2E chạy trên bản build production (`next start`); turbo build các gói workspace mà web phụ thuộc trước
      - run: pnpm exec turbo run build --filter=@vcraft/web
      - run: pnpm test:e2e
