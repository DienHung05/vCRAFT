pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{js,ts,tsx,json,jsonc,css}"
      run: pnpm biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
commit-msg:
  commands:
    conventional:
      run: grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .+' {1} || (echo "Commit message phải theo Conventional Commits, vd: feat(rfq): accept bid with pessimistic lock" && exit 1)
