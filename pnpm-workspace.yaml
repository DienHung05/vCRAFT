packages:
  - "apps/*"
  - "packages/*"
  - "tooling/*"
  - "tests/*"

# Gói được phép chạy build script khi cài (pnpm mặc định chặn tất cả)
allowBuilds:
  "@swc/core": true
  "@parcel/watcher": true
  lefthook: true
  msgpackr-extract: true
  protobufjs: true
  cpu-features: false
  ssh2: false

patchedDependencies:
  '@mikro-orm/sql@7.2.5': patches/@mikro-orm__sql@7.2.5.patch

permissions:
  '@supabase/server':
    skills: true
  '@tanstack/react-table':
    skills: true
